<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4a5568"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460.0" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1a365d">YiRage (YPK)</text>
  <text x="460.0" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#718096">Multi-backend LLM megakernel compiler &amp; runtime · github.com/chenxingqiang/YiRage</text>

  <rect x="36" y="92" width="848" height="430" rx="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="50" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#718096">Python API → Backend Manager → Search / Transpile → Persistent Kernel / RuntimeFusion</text>
<rect x="56" y="130" width="240" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="176.0" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Python API</text>
  <text x="68" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">HardwareRegistry</text>
  <text x="68" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">UnifiedCompiler</text>
  <text x="68" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">PersistentKernel / graph</text><rect x="330" y="130" width="250" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="455.0" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Backend Manager (C++)</text>
  <text x="342" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">BackendRegistry (12 backends)</text>
  <text x="342" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">CUDA / ROCm / MPS / Ascend</text>
  <text x="342" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">MACA / TPU / MLIR / CPU</text><rect x="610" y="130" width="250" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="735.0" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Search &amp; Strategy</text>
  <text x="622" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Hardware-aware search</text>
  <text x="622" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Kernel fingerprinting</text>
  <text x="622" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Perf profile / autotune</text><rect x="120" y="290" width="230" height="120" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="235.0" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Threadblock Ops</text>
  <text x="132" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">MatMul / Attention</text>
  <text x="132" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">RMSNorm / SwiGLU</text>
  <text x="132" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Fused LLM operators</text><rect x="380" y="290" width="230" height="120" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="495.0" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Transpilers</text>
  <text x="392" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Triton / NKI / MLIR</text>
  <text x="392" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">CodeGen per backend</text>
  <text x="392" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">JIT compile path</text><rect x="640" y="290" width="220" height="120" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="750.0" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Runtime</text>
  <text x="652" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Persistent Kernel launch</text>
  <text x="652" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">RuntimeFusion w/ vLLM</text>
  <text x="652" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">FusionCapsule decode path</text><line x1="296" y1="185" x2="330" y2="185" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="580" y1="185" x2="610" y2="185" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="735" y1="240" x2="735" y2="290" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="735" y1="240" x2="505" y2="290" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="735" y1="240" x2="235" y2="290" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><text x="460.0" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#718096">Graph superoptimization selects backend-specific fused kernels; RF embeds optimized capsules into vLLM/SGLang decode loops.</text></svg>
