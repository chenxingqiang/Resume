<text x="24" y="36" font-size="16" fill="#111827" font-weight="700" text-anchor="start">YiRage (YPK) — RuntimeFusion 系统架构</text>
<text x="24" y="60" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">推理引擎、RuntimeFusion、搜索计划、后端管理器、后端实现与硬件目标</text>
<text x="24" y="78" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">虚线框 = 架构分区 · 实线框 = 子系统 · 盒子 = 模块与职责</text>
<rect x="24" y="96" width="768" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">项目介绍</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YiRage 是面向大模型推理的多后端算子编译与运行时系统，核心能力是计算图超优化和 RuntimeFusion。</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">架构分为推理引擎、RuntimeFusion、搜索计划、后端管理器、后端实现和硬件目标。</text>
