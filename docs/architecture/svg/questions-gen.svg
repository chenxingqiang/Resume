<text x="180" y="103" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Questions-Gen 是基于 Qwen3-14B 的数学竞赛题生成与评估系统，采用分阶段训练策略。</text>
<text x="180" y="124" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">训练链路结合监督微调、GRPO 奖励优化、DeepSeek-R1 蒸馏、质量验证以及 Hugging Face 和 Ollama 部署。</text>
