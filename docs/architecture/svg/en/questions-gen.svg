<text x="42" y="106" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="210" y="106" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Questions-Gen is a Qwen3-14B system for generating and evaluating mathematical competition problems through staged training.</text>
<text x="210" y="128" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The pipeline combines supervised fine-tuning, GRPO reward optimization, DeepSeek-R1 distillation, validation, and local deployment.</text>
