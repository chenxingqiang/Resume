<text x="56" y="103" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="180" y="103" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">TraceSmith is a cross-platform GPU profiling and deterministic replay system for AI compiler, framework, and driver engineers.</text>
<text x="180" y="124" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Its C++17 core captures low-overhead execution events, stores compact SBT traces, and exports timelines for analysis and debugging.</text>
