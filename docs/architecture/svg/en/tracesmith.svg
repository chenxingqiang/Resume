<rect x="24" y="96" width="768" height="69" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">TraceSmith is a cross-platform GPU profiling and deterministic replay system for AI compiler, framework, and</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">driver engineers.</text>
<text x="38" y="160" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Its architecture separates applications, the pybind11 binding, a C++17 core, GPU backends, and output formats.</text>
