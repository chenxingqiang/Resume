<text x="42" y="106" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="210" y="106" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Research CLI is a terminal-first AI agent workflow that connects interactive sessions to models, tools, and MCP services.</text>
<text x="210" y="128" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Its core router manages context and provider selection while research modules cover writing, bibliography, analysis, and submission.</text>
