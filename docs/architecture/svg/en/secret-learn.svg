<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Secret-Learn exposes sklearn-compatible machine learning across federated, secret-sharing, and split-learning</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">modes.</text>
<text x="38" y="160" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The architecture comprises the sklearn API, three privacy modes, JAX acceleration, SecretFlow devices, and</text>
<text x="38" y="175" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">infrastructure.</text>
