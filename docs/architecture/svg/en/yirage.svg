<text x="1166.6666666666667" y="247.5" font-size="11.5" fill="#1e293b" font-weight="400" text-anchor="middle">block table · seq lens · SM budget</text>
<rect x="40" y="310" width="1360" height="150" rx="10" fill="#dbeafe" fill-opacity="0.42" stroke="#2563eb" stroke-dasharray="7,5"/>
