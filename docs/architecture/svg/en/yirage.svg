<text x="1166.6666666666667" y="412.5" font-size="11.5" fill="#701a75" font-weight="400" text-anchor="middle">skip → engine native ops</text>
<rect x="40" y="480" width="1360" height="155" rx="10" fill="#dcfce7" fill-opacity="0.42" stroke="#16a34a" stroke-dasharray="7,5"/>
