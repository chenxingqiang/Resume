<text x="56" y="680" font-size="13" fill="#475569" font-weight="700" text-anchor="start">BACKEND MANAGER · 编译与执行边界</text>
<rect x="60.0" y="698" width="426.7" height="79" rx="8" fill="#dbeafe" stroke="#2563eb"/>
