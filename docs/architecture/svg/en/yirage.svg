<text x="273.33333333333337" y="393.5" font-size="13.5" fill="#1e3a8a" font-weight="700" text-anchor="middle">RF.step(inputs, meta)</text>
<text x="273.33333333333337" y="412.5" font-size="11.5" fill="#1e3a8a" font-weight="400" text-anchor="middle">select 0..N capsules</text>
