<text x="28" y="42" font-size="22" fill="#111827" font-weight="700" text-anchor="start">YiRage (YPK) — RuntimeFusion Architecture</text>
<text x="28" y="66" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Inference engine, RuntimeFusion, search plan, backend manager, implementations, and hardware</text>
