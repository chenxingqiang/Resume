<text x="24" y="36" font-size="16" fill="#111827" font-weight="700" text-anchor="start">YiRage (YPK) — RuntimeFusion Architecture</text>
<text x="24" y="60" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Inference engine, RuntimeFusion, search plan, backend manager, implementations, and hardware</text>
<text x="24" y="78" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Dashed frame = architecture zone · Solid frame = subsystem · Box = module and responsibility</text>
<rect x="24" y="96" width="768" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YiRage is a multi-backend LLM kernel compiler and runtime centered on graph superoptimization and</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">RuntimeFusion.</text>
<text x="38" y="160" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The architecture separates the inference engine, RuntimeFusion, search plans, the backend manager, backend</text>
<text x="38" y="175" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">implementations, and hardware targets.</text>
