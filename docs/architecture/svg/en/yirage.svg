<rect x="0" y="0" width="1440" height="1230" fill="#ffffff"/>
<text x="40" y="44" font-size="22" fill="#111827" font-weight="700" text-anchor="start">YiRage (YPK) — 系统架构 · RuntimeFusion 数据流</text>
<text x="40" y="68" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Inference engine owns scheduling/KV; RF owns fusion identity; search and execute use the same backend</text>
<rect x="1035" y="18" width="365" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<line x1="1052" y1="36" x2="1084" y2="36" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="1092" y="40" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Primary flow</text>
<line x1="1052" y1="58" x2="1084" y2="58" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrP)"/>
<text x="1092" y="62" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Fallback / feedback</text>
<text x="1215" y="40" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Dashed = architecture zone</text>
<text x="1215" y="62" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Box = module + responsibility</text>
<rect x="40" y="82" width="1360" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="103" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="180" y="103" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YiRage is a multi-backend LLM kernel compiler and runtime centered on graph superoptimization and RuntimeFusion.</text>
<text x="180" y="124" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">It searches backend-specific fusion plans offline, then injects verified FusionCapsules into vLLM or SGLang decode steps.</text>
<rect x="40" y="150" width="1360" height="140" rx="10" fill="#fff7ed" fill-opacity="0.42" stroke="#ea580c" stroke-dasharray="7,5"/>
<text x="56" y="175" font-size="13" fill="#475569" font-weight="700" text-anchor="start">INFERENCE ENGINE · 调度与 KV 所有者</text>
<rect x="60.0" y="193" width="426.7" height="79" rx="8" fill="#fff7ed" stroke="#ea580c"/>
<text x="273.33333333333337" y="228.5" font-size="13.5" fill="#7c2d12" font-weight="700" text-anchor="middle">vLLM</text>
<text x="273.33333333333337" y="247.5" font-size="11.5" fill="#7c2d12" font-weight="400" text-anchor="middle">continuous batch · PagedAttention</text>
<rect x="506.7" y="193" width="426.7" height="79" rx="8" fill="#fff7ed" stroke="#ea580c"/>
<text x="720.0" y="228.5" font-size="13.5" fill="#7c2d12" font-weight="700" text-anchor="middle">SGLang</text>
<text x="720.0" y="247.5" font-size="11.5" fill="#7c2d12" font-weight="400" text-anchor="middle">RadixAttention · extend meta</text>
