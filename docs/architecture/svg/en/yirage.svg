<text x="42" y="106" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="210" y="106" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YiRage is a multi-backend LLM kernel compiler and runtime centered on graph superoptimization and RuntimeFusion.</text>
<text x="210" y="128" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The architecture separates the inference engine, RuntimeFusion, search plans, the backend manager, backend implementations, and hardware targets.</text>
