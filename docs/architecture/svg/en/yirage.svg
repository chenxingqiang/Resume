<text x="1222.5" y="566.0" font-size="13.5" fill="#701a75" font-weight="700" text-anchor="middle">Ray Coordinator</text>
<text x="1222.5" y="585.0" font-size="11.5" fill="#701a75" font-weight="400" text-anchor="middle">optional distributed search</text>
