<text x="720.0" y="420.5" font-size="11.5" fill="#14532d" font-weight="400" text-anchor="middle">segment pipeline</text>
<rect x="953.3" y="353" width="426.7" height="89" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
