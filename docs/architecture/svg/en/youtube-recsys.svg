<text x="56" y="103" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="180" y="103" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YouTube-DNN-RecSys is a TensorFlow and Spark implementation of the candidate-generation stage of YouTube recommendations.</text>
<text x="180" y="124" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">It turns behavior histories into TFRecords, learns user and item embeddings, and produces Top-K recall candidates for serving.</text>
