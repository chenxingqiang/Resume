<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">YouTube-DNN-RecSys is a TensorFlow and Spark implementation of the candidate-generation stage of YouTube</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">recommendations.</text>
<text x="38" y="160" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The architecture comprises data processing, storage, the dnn.py model, prediction services, and support</text>
<text x="38" y="175" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">utilities.</text>
