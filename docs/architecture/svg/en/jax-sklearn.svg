<text x="24" y="36" font-size="16" fill="#111827" font-weight="700" text-anchor="start">JAX-sklearn (xlearn) — Transparent Acceleration Architecture</text>
<text x="24" y="60" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">User API, compatibility layer, JAX implementations, data policy, and hardware backends</text>
<text x="24" y="78" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Dashed frame = architecture zone · Solid frame = subsystem · Box = module and responsibility</text>
<rect x="24" y="96" width="768" height="69" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="38" y="114" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="38" y="130" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">JAX-sklearn provides a drop-in scikit-learn API while transparently accelerating supported estimators with JAX.</text>
<text x="38" y="145" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">The architecture has a user API, a compatibility layer, JAX implementations, a data policy, and hardware</text>
<text x="38" y="160" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">backends.</text>
