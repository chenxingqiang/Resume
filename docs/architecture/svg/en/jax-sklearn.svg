<rect x="0" y="0" width="1720" height="901" fill="#ffffff"/>
<text x="28" y="42" font-size="22" fill="#111827" font-weight="700" text-anchor="start">JAX-sklearn (xlearn) — Transparent Acceleration Architecture</text>
<text x="28" y="66" font-size="13" fill="#475569" font-weight="400" text-anchor="start">xlearn/__init__.py injects proxies; xlearn/_jax dispatches to JAX or the original sklearn estimator</text>
