<text x="42" y="106" font-size="11.5" fill="#475569" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="210" y="106" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">JAX-sklearn provides a drop-in scikit-learn API while transparently accelerating supported estimators with JAX.</text>
<text x="210" y="128" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">Runtime proxies select JAX or native sklearn by algorithm, data size, and platform, preserving familiar inputs and outputs.</text>
