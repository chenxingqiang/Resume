  <text x="182" y="424" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Bibliography (arXiv/PubMed)  ·  LaTeX manager  ·  Experiment codegen  ·  Journal matcher / submission prep</text><line x1="460" y1="210" x2="220" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="460" y1="210" x2="470" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="460" y1="210" x2="720" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="470" y1="350" x2="460" y2="390" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><text x="460.0" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#718096">User prompts flow through core, selected provider generates plans, tools/MCP execute actions, results stream back to terminal.</text></svg>
