<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4a5568"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460.0" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1a365d">JAX-sklearn (xlearn)</text>
  <text x="460.0" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#718096">Drop-in sklearn API with automatic JAX acceleration · github.com/chenxingqiang/jax-sklearn</text>

  <rect x="36" y="92" width="848" height="430" rx="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="50" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#718096">User API → Proxy → JAX / NumPy fallback → Hardware backends</text>
<rect x="80" y="140" width="760" height="70" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="460.0" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">User Code Layer</text>
  <text x="92" y="174" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">import xlearn as sklearn  ·  LinearRegression / KMeans / PCA  ·  100% sklearn-compatible API</text><rect x="110" y="240" width="220" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="220.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Compatibility Layer</text>
  <text x="122" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Lazy module import</text>
  <text x="122" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Intelligent proxy</text>
  <text x="122" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Runtime class injection</text><rect x="360" y="240" width="220" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="470.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">JAX Acceleration</text>
  <text x="372" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">JIT / vmap dispatch</text>
  <text x="372" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Algorithm thresholds</text>
  <text x="372" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Universal JAX mixins</text><rect x="610" y="240" width="220" height="110" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="720.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Data Management</text>
  <text x="622" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">NumPy ↔ JAX arrays</text>
  <text x="622" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">dtype / shape guards</text>
  <text x="622" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">Graceful fallback</text><rect x="235" y="390" width="450" height="70" rx="10" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="460.0" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2c5282">Hardware Abstraction</text>
  <text x="247" y="424" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#2d3748">CPU (default)  ·  CUDA GPU  ·  Apple Metal  ·  Google TPU</text><line x1="460" y1="210" x2="220" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="460" y1="210" x2="470" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="460" y1="210" x2="720" y2="240" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="470" y1="350" x2="460" y2="390" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/><text x="460.0" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#718096">Proxy decides JAX vs native sklearn by dataset size, algorithm type, and configured hardware.</text></svg>
